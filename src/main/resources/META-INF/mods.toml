modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/TheDeathlyCow/immersive-storms/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/immersive_storms/icon.png"
displayURL="https://github.com/TheDeathlyCow/immersive-storms"
authors="${mod_authors}"
credits="Original mod by TheDeathlyCow. Sound effects from Pixabay (see CREDITS.md)."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cloth_config"
    mandatory=true
    versionRange="[${cloth_config_version},)"
    ordering="AFTER"
    side="CLIENT"
